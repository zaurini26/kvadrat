name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create Android project
        run: |
          set -e
          mkdir -p android/app/src/main/java/app/kvadrat/chess android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cat > android/settings.gradle <<'EOF'
          pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          rootProject.name='Kvadrat'
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins{id 'com.android.application' version '8.7.3' apply false}
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins{id 'com.android.application'}
          android{
           namespace 'app.kvadrat.chess'
           compileSdk 35
           defaultConfig{applicationId 'app.kvadrat.chess';minSdk 24;targetSdk 35;versionCode 1;versionName '1.0'}
           compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application android:label="Квадрат" android:icon="@android:drawable/sym_def_app_icon" android:theme="@android:style/Theme.DeviceDefault.NoActionBar" android:hardwareAccelerated="true">
          <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity></application></manifest>
          EOF
          cat > android/app/src/main/java/app/kvadrat/chess/MainActivity.java <<'EOF'
          package app.kvadrat.chess;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient());
              w.setOverScrollMode(View.OVER_SCROLL_NEVER);
              w.setOnApplyWindowInsetsListener((v, i) -> {
                v.setPadding(i.getSystemWindowInsetLeft(), i.getSystemWindowInsetTop(), i.getSystemWindowInsetRight(), i.getSystemWindowInsetBottom());
                return i;
              });
              setContentView(w);
              w.loadUrl("file:///android_asset/index.html");
            }
            @Override protected void onPause() { super.onPause(); w.onPause(); w.pauseTimers(); }
            @Override protected void onResume() { super.onResume(); w.onResume(); w.resumeTimers(); }
            @Override public void onBackPressed() { finish(); }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Kvadrat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kvadrat v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
